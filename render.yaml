services:
  - type: web
    name: pharmarec-backend
    runtime: python
    plan: standard   # 2 GB RAM minimum (sentence-transformers needs ~1 GB)
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PORT
        value: "10000"
      - key: HF_REPO
        sync: false  # Set this in Render dashboard to your HF repo (e.g., username/pharmarec-weights)
